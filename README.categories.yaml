# Per-category intro paragraphs, keyed by category slug (slugified label).

level-1-on-your-device: >
  Nothing leaves the machine — the strongest guarantee there is. The full
  catalog of local tools lives in
  [awesome-local-ai](https://github.com/BrethofAI/awesome-local-ai); these
  are the ones whose privacy story we checked.

level-2-on-your-server: >
  You run the whole stack on hardware you control, so the vendor never sees
  your data. Watch the defaults: several phone home for telemetry until you
  switch it off, and each entry says how.

level-3-cant-see-provably: >
  Hosted, but the operator is locked out by cryptography, not by promise:
  end-to-end encryption, or a hardware enclave whose running code your
  client verifies before it sends anything.

level-4-processes-never-stores: >
  These services have to read your data to do their job. What earns a
  place here is what happens next: a written no-retention, no-training
  commitment; nothing stored except on your machine or under a key only
  you hold; and a data flow you can check.

open-weights-models-you-can-audit: >
  Closed weights = closed privacy story. Public weights let you read what the
  model is, run it offline, and verify there's no hidden phone-home in the
  inference path.

privacy-auditing-tools: >
  Verify the claims of vendors you have to use.
