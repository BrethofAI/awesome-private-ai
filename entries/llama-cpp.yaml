tagline: 'The C/C++ inference engine most local tools build on, with an OpenAI-compatible
  server (`llama serve` / llama-server) and a built-in web UI. MIT, no account, no telemetry;
  the network is touched only when you pull models from Hugging Face (`-hf`, or a download
  you start in the web UI), connect an MCP server you added, use the installer, or turn on
  an option that is off by default: the web UI''s "Use the Hugging Face Hub API" (model
  details and avatars from huggingface.co) or "Enable Discover Models" (also the llama.app
  catalog), or the experimental `--connect` remote access (v0.8.0), which announces the
  server on public WebTorrent trackers and uses Google STUN servers to open a peer-to-peer
  tunnel.'
