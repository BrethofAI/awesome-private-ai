tagline: 'The C/C++ inference engine most local tools build on, with an OpenAI-compatible
  server (`llama serve` / llama-server) and a built-in web UI. MIT, no account, no telemetry;
  the network is touched only when you pull models from Hugging Face (`-hf`, or a download
  you start in the web UI), connect an MCP server you added, or use the installer. In v0.6.0
  the web UI''s new Hugging Face and llama.app catalog code is never called; later builds
  read model details and avatars from huggingface.co only if you turn on "Use Hugging Face
  Hub API for models metadata" (off by default).'
