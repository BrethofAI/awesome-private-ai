tagline: 'Self-hosted chat UI for local + remote LLMs; pair it with Ollama or any
  OpenAI-compatible backend. Source-available since v0.6.6 (Apr 2025): BSD-3 plus a branding
  clause (over 50 users in 30 days may not remove the branding without permission); its docs
  say it is not OSI open source. Telemetry off in the official image, but it checks GitHub
  for updates by default — ENABLE_VERSION_UPDATE_CHECK=false or OFFLINE_MODE=true. Core is
  free; Terminals needs an enterprise licence.'
